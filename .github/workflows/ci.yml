name: ci

on:
  push:
    branches: [main, "phase/**"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Run weekly on Monday at 04:00 UTC to catch emerging CVE disclosures
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit (the comment names the tag that commit carried when pinned);
# Dependabot's github-actions updates keep both in step. Every job has a timeout.
#
# A tag build (refs/tags/v*) is a release build: the version comes from the tag, the `release`
# Maven profile refuses SNAPSHOT versions and SNAPSHOT dependencies, the archives are built and
# smoke-tested on both operating systems, then signed and published by the `release` job.

# Shape (ci-fast): `build` is the slow leg (Windows about 14 minutes). `package`, `integration` and
# `dependency-audit` do not wait for it, so a pull request's wall clock is the slowest job and not
# the sum of two; only the `release` job (tags) needs `build`, so nothing is ever published from a
# red build. Each build job starts with the format gate so a formatting slip costs seconds.

jobs:
  build:
    name: build+unit+acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format gate (fails in seconds, before the 7 to 14 minute build)
        shell: bash
        run: ./mvnw -B -q spotless:check
      - name: Use the tag as the release version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.22.0:set -DnewVersion="${GITHUB_REF_NAME#v}" -DprocessAllModules=true -DgenerateBackupPoms=false -DupdateBuildOutputTimestamp=false
      - name: Build, unit tests, acceptance (all phases, needs-jrs/needs-docker excluded)
        shell: bash
        run: ./mvnw -B verify ${{ startsWith(github.ref, 'refs/tags/v') && '-Prelease' || '' }}

  # Issue #188: the two ways a later builder is most likely to differ from `build`. The tree is a
  # `git archive` ZIP unpacked by Python, which, like GitHub's "Download ZIP" opened with most
  # tools, has no .git and no executable bits; the build runs as root, which ignores permission
  # bits, so a test that takes a permission away must skip itself there instead of failing.
  archive-as-root:
    name: build from a source ZIP as root (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unpack a source ZIP (no .git, no executable bits)
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=jrsctl/ HEAD -o "$RUNNER_TEMP/src.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$RUNNER_TEMP/src.zip" "$RUNNER_TEMP/archive"
          test ! -e "$RUNNER_TEMP/archive/jrsctl/.git"
          test ! -x "$RUNNER_TEMP/archive/jrsctl/mvnw"
      - name: Unit tests and acceptance as root, from the unpacked ZIP
        working-directory: ${{ runner.temp }}/archive/jrsctl
        run: sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" bash scripts/mvn.sh -fae verify -Djacoco.skip=true -Dmaven.repo.local="$HOME/.m2/repository"

  integration:
    name: integration (Testcontainers, Linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Docker-backed tests
        run: ./mvnw -B verify -Dexcluded.groups=needs-jrs -Dgroups=needs-docker

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: dependency audit (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The vulnerability database (H2, about 500 MB) is kept between runs: every run restores the
      # newest cache and saves its own, so only the "modified" feed is fetched. A full load from
      # the NVD REST API took over two hours at the API's throttled rate and timed out this job.
      # restore/save rather than the combined action: the combined action saves only when the job
      # succeeds, and this job fails by design while a High advisory is open.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      # A pull request opened by Dependabot runs with the Dependabot secret set, not the
      # repository's, so the key is absent there until it is added under Settings → Secrets →
      # Dependabot as well. That case is a notice and a skipped audit, not a failure: the same
      # commit is audited on main after the merge, and a red audit on every dependency PR stops
      # meaning anything (assessment item B2). Any other run without the key still fails.
      - name: Require the NVD API key (the audit is a release gate, so it must not silently skip)
        id: nvd
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::NVD_API_KEY is not in the Dependabot secret set; the dependency audit is skipped on this pull request and runs on main after the merge"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the NVD_API_KEY repository secret is not set; the dependency audit cannot run (spec §20)"
            exit 1
          fi
      # The plugin configuration lives in the root pom (pluginManagement) so this job and a local
      # `-Pdependency-check` run judge the same thing: what ships (spec §20), at CVSS 7, with bulk
      # data from the project's daily NVD mirror and the key read from the environment by name, so
      # it never appears on a command line. The key stays required so the job can fall back to the
      # REST API by clearing nvdDatafeedUrl.
      - name: OWASP dependency check (fails at CVSS >= 7)
        if: steps.nvd.outputs.present == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -DskipTests -Pdependency-check org.owasp:dependency-check-maven:aggregate
      # Saved even when the audit failed on an open advisory (see above), but only when it ran:
      # a run that never opened the database would otherwise write a 500 MB copy of the restored
      # cache under a new key and evict the Maven cache (assessment item B9).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.nvd.outputs.present == 'true'
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}

  package:
    name: package (jlink image, archive, SBOM, portable smoke) (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            ext: tar.gz
          - os: windows-latest
            platform: windows-x64
            ext: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Use the tag as the release version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.22.0:set -DnewVersion="${GITHUB_REF_NAME#v}" -DprocessAllModules=true -DgenerateBackupPoms=false -DupdateBuildOutputTimestamp=false
      - name: Build image, archive, checksum, SBOM (ADR-0003, ADR-0008)
        shell: bash
        run: ./mvnw -B -Pdist -DskipTests package ${{ startsWith(github.ref, 'refs/tags/v') && '-Prelease' || '' }}
      - name: Portable smoke on Linux (no JAVA_HOME, minimal PATH; ADR-0003 "clean VM" check)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive=$(ls dist/target/jrsctl-*-${{ matrix.platform }}.${{ matrix.ext }})
          (cd dist/target && sha256sum -c "$(basename "$archive").sha256")
          rm -rf /tmp/portable && mkdir -p /tmp/portable && tar -xzf "$archive" -C /tmp/portable
          root=$(ls -d /tmp/portable/jrsctl-*)
          (cd "$root" && sha256sum --quiet -c MANIFEST.sha256)
          env -i PATH=/usr/bin:/bin HOME=/tmp/portable JRSCTL_HOME=/tmp/portable/home "$root/bin/jrsctl" --version
          env -i PATH=/usr/bin:/bin HOME=/tmp/portable JRSCTL_HOME=/tmp/portable/home "$root/bin/jrsctl" selfcheck
      - name: Portable smoke on Windows (no JAVA_HOME, minimal PATH; ADR-0003 "clean VM" check)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = (Get-ChildItem dist/target -Filter "jrsctl-*-${{ matrix.platform }}.${{ matrix.ext }}").FullName
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum mismatch for $archive" }
          $dest = Join-Path $env:RUNNER_TEMP portable
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $archive -DestinationPath $dest
          $root = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          $env:JAVA_HOME = ''
          $env:JRSCTL_HOME = Join-Path $dest home
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$root\bin\jrsctl.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          & "$root\bin\jrsctl.cmd" selfcheck
          if ($LASTEXITCODE -ne 0) { throw "selfcheck exited $LASTEXITCODE" }
      - name: Phase 7 acceptance against the built image (reactor up to acceptance, only the phase7 class)
        # bash on both runners: pwsh splits a dotted -D property at the dot ("Unknown lifecycle phase")
        shell: bash
        run: ./mvnw -B -pl acceptance -am verify -Dphase=7 -Pdist -Dtest=Phase7DistributionTest -Dsurefire.failIfNoSpecifiedTests=false ${{ startsWith(github.ref, 'refs/tags/v') && '-Prelease' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jrsctl-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/target/jrsctl-*-${{ matrix.platform }}.${{ matrix.ext }}
            dist/target/jrsctl-*-${{ matrix.platform }}.${{ matrix.ext }}.sha256
      # The SBOM describes the jar, not the platform image, so both legs write the same document
      # apart from its serial and timestamp. One leg uploads it, so the signed SBOM has a definite
      # provenance instead of whichever leg the release job's merge downloaded last (item B8).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform == 'linux-x64'
        with:
          name: jrsctl-sbom
          if-no-files-found: error
          path: dist/target/jrsctl-*-sbom.json

  release:
    name: sign (CI secret) and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `integration` is not a release gate: it selects needs-docker tests and none exist yet
    # (ADR-0007, deferred), so its green would be a vacuous one. The adapter contract suite runs
    # per compat-matrix row against recorded servers inside `build` (ADR-0011).
    needs: [build, package, dependency-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: "Require the signing key (spec §0 rule 11: the key exists only here)"
        env:
          JRSCTL_SIGNING_KEY: ${{ secrets.JRSCTL_SIGNING_KEY }}
        run: |
          if [ -z "$JRSCTL_SIGNING_KEY" ]; then
            echo "::error::the JRSCTL_SIGNING_KEY repository secret is not set; a release cannot be signed"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jrsctl-*
          path: release
          merge-multiple: true
      - name: Check that both archives carry the tag's version and match their checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ls -l release
          test -f "release/jrsctl-$version-linux-x64.tar.gz" || { echo "::error::no Linux archive for $version"; exit 1; }
          test -f "release/jrsctl-$version-windows-x64.zip" || { echo "::error::no Windows archive for $version"; exit 1; }
          test -f "release/jrsctl-$version-sbom.json" || { echo "::error::no SBOM for $version"; exit 1; }
          (cd release && sha256sum -c ./*.sha256)
      - name: "Sign archives, checksums and SBOM (spec §0 rule 11: the key exists only here)"
        env:
          JRSCTL_SIGNING_KEY: ${{ secrets.JRSCTL_SIGNING_KEY }}
        run: sh scripts/sign-artifacts.sh release
      - name: Fail the release when nothing was signed
        run: |
          test -n "$(ls release/*.sig 2>/dev/null)" || { echo "::error::no signatures produced"; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: jrsctl ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.zip
            release/*.tar.gz
            release/*.sha256
            release/*-sbom.json
            release/*.sig

  # The nightly needs-jrs adapter contract suite lives in nightly.yml once a JRS image is named (spec §19 Q6).
